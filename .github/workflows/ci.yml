# Continuous integration for mic_recorder.
#
# Runs the full local-gate set on every push/PR to main (format, analyze,
# test with coverage, pana) plus the two native compile gates the Linux dev
# sandbox cannot provide locally: an Android debug APK build and an iOS
# no-codesign build from example/.
#
# The iOS job exists precisely because there is no Xcode on Linux — it is
# the compile verification for the Swift sources
# (ios/mic_recorder/Sources/...). See doc/ARCHITECTURE.md §9.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: flutter analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

  format:
    name: dart format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

  test:
    name: flutter test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

  pana:
    name: pana (pub.dev score)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pana needs the Flutter SDK to fully resolve and analyze a plugin
      # package; a plain Dart SDK silently degrades the report.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install pana
        run: dart pub global activate pana

      - name: Run pana (pub.dev scoring engine, dartdoc included)
        run: dart pub global run pana --flutter-sdk "$FLUTTER_ROOT" .

  android:
    name: Android debug APK (example)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: example
        run: flutter pub get

      - name: Build debug APK
        working-directory: example
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: example-debug-apk
          path: example/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS no-codesign build (example)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: example
        run: flutter pub get

      # The example app ships Android-only to keep the repo lean; generate
      # the iOS runner on demand — without it `flutter build ios` fails
      # with "Application not configured for iOS".
      - name: Generate the iOS runner
        working-directory: example
        run: flutter create . --platforms=ios

      # Closes the no-Xcode-locally gap: the Swift plugin sources are only
      # compiler-verified here (or on a local macOS machine).
      - name: Build iOS (no codesign)
        working-directory: example
        run: flutter build ios --no-codesign
